<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./#/" />
    <title>Redirecting…</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #0b0f14;
        color: #e8eef7;
      }
      a {
        color: #7aa2ff;
      }
    </style>
  </head>
  <body>
    <p>Redirecting to the app… If nothing happens, <a href="./#/">click here</a>.</p>
    <script>
      (function () {
        const base = './#/';
        try {
          const target = base;
          if (window.location && window.location.replace) {
            window.location.replace(target);
          } else {
            window.location.href = target;
          }
        } catch (e) {
          window.location.href = base;
        }
      })();
    </script>
  </body>
</html>
