server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # All routes fall back to index.html (HashRouter handles client routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vendor / dict / js assets served directly
    location ~* \.(js|css|wasm|gz|json|otf|ttf|woff|woff2|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
}
