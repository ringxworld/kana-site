services:
  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    ports:
      - "80:80"
    depends_on:
      - server

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DB_PATH: /data/kana.db
      CORS_ORIGIN: "http://localhost"
    volumes:
      - kana-data:/data

volumes:
  kana-data:
