services:
  ci:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ci
    environment:
      KANA_CI_CONTAINER: "1"
    volumes:
      - ..:/app
      # Named volume shadows host node_modules so Linux platform packages
      # (e.g. esbuild linux binaries) are never written back to the Windows checkout.
      - ci_node_modules:/app/node_modules
    profiles:
      - ci
    # Full gate:  docker compose -f docker/docker-compose.yml --profile ci run --rm ci
    # Fast gate:  docker compose -f docker/docker-compose.yml --profile ci run --rm ci bash docker/scripts/ci_part.sh

  runner:
    image: myoung34/github-runner:latest
    environment:
      RUNNER_NAME: local-runner
      REPO_URL: https://github.com/shikarii/kana-site
      RUNNER_TOKEN: "${RUNNER_TOKEN}"
      LABELS: self-hosted,local
      RUNNER_WORKDIR: /tmp/runner
    restart: unless-stopped
    profiles:
      - ci
    # One-time setup: bash docker/scripts/setup_runner.sh
    # Start:  docker compose -f docker/docker-compose.yml --profile ci up -d runner
    # Stop:   docker compose -f docker/docker-compose.yml --profile ci stop runner

volumes:
  ci_node_modules:
