ollama:
  models:
    - qwen2.5:3b
  gpu:
    enabled: true
    type: nvidia
    number: 1

resources:
  requests:
    memory: "2Gi"
  limits:
    memory: "4Gi"
    nvidia.com/gpu: 1

service:
  type: ClusterIP
  port: 11434

# Persist downloaded models across pod restarts
persistentVolume:
  enabled: true
  size: 4Gi
