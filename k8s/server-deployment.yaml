apiVersion: apps/v1
kind: Deployment
metadata:
  name: kotoba-server
  namespace: kotoba
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kotoba-server
  template:
    metadata:
      labels:
        app: kotoba-server
    spec:
      containers:
        - name: server
          image: kotoba-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: kotoba-config
            - secretRef:
                name: kotoba-secret
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kotoba-data
