<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1115" />
    <title>Japanese Furigana Reader</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Shippori+Mincho:wght@400;600&family=Hina+Mincho&family=Yuji+Syuku&family=Yuji+Mai&family=Yusei+Magic&family=Kaisei+Decol:wght@400;600&family=Zen+Kurenaido&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0f1115;
        --fg: #e7eaf0;
        --muted: #aab2c0;
        --panel: #161a22;
        --border: #262c3a;
        --accent: #7aa2f7;

        --maxw: 900px;
        --fs: 20px;
        --lh: 1.9;

        /* Default reader font */
        --jp-font: "Yuji Mai","Hina Mincho","Shippori Mincho","Noto Serif JP","Yu Mincho","MS Mincho",serif;
      }

      /* Project site friendly paths (no leading slash) */
      @font-face {
        font-family: "Zin Hena Bokuryu RCF";
        src: url("fonts/ZinHenaBokuryu-RCF.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Zin Hena Bokuryu RDF";
        src: url("fonts/ZinHenaBokuryu-RDF.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans",
          sans-serif;
      }

      header {
        padding: 18px 18px 10px 18px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
      }

      .wrap {
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 0 18px 28px 18px;
      }

      .topline {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--fg);
      }

      .nav {
        margin-left: auto;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .nav a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.02);
      }

      .nav a:hover {
        border-color: rgba(122, 162, 247, 0.6);
      }

      .sub {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin: 14px 0 16px 0;
        padding: 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      button,
      input[type="file"]::file-selector-button,
      select {
        background: rgba(255, 255, 255, 0.02);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
      }

      button:hover,
      select:hover,
      input[type="file"]::file-selector-button:hover {
        border-color: rgba(122, 162, 247, 0.6);
      }

      select:focus {
        outline: 2px solid rgba(122, 162, 247, 0.45);
        outline-offset: 2px;
      }

      select option {
        background: var(--panel);
        color: var(--fg);
      }

      label {
        font-size: 13px;
        color: var(--muted);
        display: inline-flex;
        gap: 8px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 7px 10px;
        background: rgba(255, 255, 255, 0.02);
      }

      input[type="range"] {
        width: 160px;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        background: rgba(255, 255, 255, 0.02);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        line-height: 1.5;
        font-size: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      }

      .reader {
        margin-top: 14px;
        padding: 22px 18px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 14px;
      }

      .content {
        font-size: var(--fs);
        line-height: var(--lh);
        letter-spacing: 0.01em;
        word-break: break-word;
        font-family: var(--jp-font);
        padding-top: 0.35em;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .sentence {
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.01);
  border-radius: 12px;

  /* Headroom for absolute-position furigana */
  padding: 22px 14px 12px 14px;

  /* Ensure nothing gets clipped weirdly */
  overflow: visible;
}



      .jp-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .jp { padding-top: 0.15em; }


      .en {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans",
          sans-serif;
        font-size: 0.9em;
        line-height: 1.55;
      }

      .en.hidden {
        display: none;
      }

      .enbtn {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: 0.02em;
        user-select: none;
      }

      .enbtn[aria-pressed="true"] {
        border-color: rgba(122, 162, 247, 0.7);
      }

      /* Furigana renderer for explicit format: (BASE (READING)) */
      .furi {
        display: inline-block;
        position: relative;
        vertical-align: baseline;
        white-space: nowrap;
      }

      .furi .base {
        display: inline-block;
        line-height: 1.15;
      }

      .furi .rt {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 100%;
        margin-bottom: 0.10em;
        font-size: 0.55em;
        line-height: 1;
        color: var(--muted);
        user-select: none;
        white-space: nowrap;
         margin-bottom: 0.12em;
  /* Optional: cap how far it can sit above */
  max-width: 12em;
      }

      .hide-furi .rt {
        display: none;
      }

      .pill {
        font-size: 12px;
        color: var(--muted);
        padding: 6px 10px;
        border: 1px dashed var(--border);
        border-radius: 999px;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="wrap">
        <div class="topline">
          <h1>Japanese Furigana Reader</h1>
          <div class="nav">
            <a href="./">Home</a>
            <a href="./jp_reader.html" aria-current="page">Reader</a>
          </div>
        </div>

        <div class="sub">
          Input format (paired lines): JP then EN. Example:
          <span class="pill">よくできた(作品 (さくひん))だ。</span>
          <span class="pill">It’s a well-made piece of work.</span>
        </div>
      </div>
    </header>

    <div class="wrap">
      <div class="controls">
        <div class="row">
          <input id="file" type="file" accept=".txt,.md,.text" />
          <button id="renderBtn">Render</button>
          <button id="clearBtn">Clear</button>
          <span class="pill">JP line then EN line. Blank lines allowed.</span>
        </div>

        <div class="row">
          <label><input id="toggleFuri" type="checkbox" checked /> Show furigana</label>

          <label><input id="showAllEn" type="checkbox" /> Show all English</label>

          <label>
            Font
            <select id="fontSelect" aria-label="Font selection">
              <option value="yuji_mai" selected>Yuji Mai (default)</option>
              <option value="serif">Noto Serif JP (normal)</option>
              <option value="sans" selected>Noto Sans JP (clean)</option>
              <option value="shippori">Shippori Mincho (literary)</option>
              <option value="hina">Hina Mincho (handwritten-ish)</option>
              <option value="yuji">Yuji Syuku (brush-ish)</option>
              <option value="yusei">Yusei Magic (marker handwritten)</option>
              <option value="kaisei_decol">Kaisei Decol (decorative)</option>
              <option value="zen_kurenaido">Zen Kurenaido (handwritten quirky)</option>
              <option value="zin_bokuryu">Zin Hena Bokuryu (free brush)</option>
              <option value="zin_bokuryu_hard">Zin Hena Bokuryu RDF (very hard)</option>
              <option value="system_mincho">System Mincho</option>
              <option value="system_gothic">System Gothic</option>
            </select>
          </label>

          <label>
            Font size
            <input id="fontSize" type="range" min="16" max="52" value="20" />
            <span id="fontSizeVal" class="pill">20px</span>
          </label>

          <label>
            Line height
            <input id="lineHeight" type="range" min="1.4" max="2.4" step="0.05" value="1.9" />
            <span id="lineHeightVal" class="pill">1.9</span>
          </label>

          <label>
            Preserve outer parentheses
            <input id="keepParens" type="checkbox" />
          </label>
        </div>
      </div>

      <textarea
        id="input"
        placeholder="Paste paired lines here:
JP sentence
English translation

JP sentence
English translation"
      ></textarea>

      <div class="reader">
        <div id="output" class="content"></div>
      </div>
    </div>

    <script src="./js/jp_reader.js" defer></script>
  </body>
</html>
