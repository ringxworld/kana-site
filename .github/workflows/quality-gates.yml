name: Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Jobs run on the local self-hosted runner managed by shikarii/ci-infra.
# client-quality and server-quality call Dagger pipelines (ci/) which cache
# npm installs in persistent cache volumes — warm runs are ~60 s vs ~3 min cold.
#
# Local testing:  act pull_request  (requires .actrc in repo root)
# Single job:     act pull_request -j client-quality

permissions:
  contents: read

jobs:
  # ── Client (Vite / React) ────────────────────────────────────────────────────
  client-quality:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dagger/dagger-for-github@v6
        with:
          verb: call
          module: ./ci
          args: client-quality --source .

  # ── Server (Hono / Node) ─────────────────────────────────────────────────────
  server-quality:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dagger/dagger-for-github@v6
        with:
          verb: call
          module: ./ci
          args: server-quality --source .

  # ── LOC limits (AGENTS.md §11.5) ─────────────────────────────────────────────
  # Pure file-size checks — no dependencies, no caching benefit from Dagger.
  loc-limits:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check file LOC limits
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          # Root limit: no source file > 300 lines
          while IFS= read -r -d '' f; do
            lines=$(wc -l < "$f")
            if (( lines > 300 )); then
              echo "FAIL: $f has $lines lines (limit 300)"
              FAIL=1
            fi
          done < <(find client server/src -name '*.ts' -o -name '*.tsx' | tr '\n' '\0')
          # Tighter server limit: service files <= 200 lines
          while IFS= read -r -d '' f; do
            lines=$(wc -l < "$f")
            if (( lines > 200 )); then
              echo "FAIL: $f has $lines lines (server service limit 200)"
              FAIL=1
            fi
          done < <(find server/src/services -name '*.ts' | tr '\n' '\0')
          # Route handler files <= 100 lines (exclude types.ts / index.ts)
          while IFS= read -r -d '' f; do
            lines=$(wc -l < "$f")
            if (( lines > 100 )); then
              echo "FAIL: $f has $lines lines (route handler limit 100)"
              FAIL=1
            fi
          done < <(find server/src/routes -name '*.ts' ! -name 'types.ts' ! -name 'index.ts' | tr '\n' '\0')
          if (( FAIL )); then
            echo "One or more files exceed LOC limits. See AGENTS.md §11.5."
            exit 1
          fi
          echo "LOC check passed."

  # ── Docker build smoke-test ──────────────────────────────────────────────────
  # Uses legacy builder (DOCKER_BUILDKIT=0) to avoid a known containerd
  # snapshot-commit bug on self-hosted runners.
  docker-build:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: [client-quality, server-quality, loc-limits]
    env:
      DOCKER_BUILDKIT: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Build client image
        run: docker build -f docker/Dockerfile.client -t kana-client:ci .
      - name: Build server image
        run: docker build -f docker/Dockerfile.server -t kana-server:ci .
