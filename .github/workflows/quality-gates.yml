name: Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Jobs run on the local self-hosted runner (zero GitHub compute cost).
# Start the runner before opening PRs: bash docker/scripts/setup_runner.sh
# The runner container is defined in docker/docker-compose.yml under the ci profile.

permissions:
  contents: read

jobs:
  # ── Client (Vite / React) ────────────────────────────────────────────────────
  client-quality:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install client dependencies
        run: npm ci
      - name: Format check
        run: npm run format -- --check
      - name: Lint check
        run: npm run lint:check
      - name: Typecheck
        run: npm run typecheck
      - name: Client tests
        run: npm run test:run
      - name: Build
        run: npm run build

  # ── Server (Hono / Node) ─────────────────────────────────────────────────────
  server-quality:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Server typecheck
        working-directory: server
        run: npx tsc --noEmit
      - name: Server tests
        working-directory: server
        run: npm run test

  # ── Docker build smoke-test ──────────────────────────────────────────────────
  docker-build:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: [client-quality, server-quality]
    steps:
      - uses: actions/checkout@v6
      - name: Build client image
        run: docker build -f docker/Dockerfile.client -t kana-client:ci .
      - name: Build server image
        run: docker build -f docker/Dockerfile.server -t kana-server:ci .
