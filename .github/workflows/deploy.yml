name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Dictionaries Cache
        uses: actions/cache@v4
        with:
          path: |
            client/public/dict
            client/public/vendor
          key: ${{ runner.os }}-dicts-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Sync Dictionaries
        run: |
          if [ -f client/public/dict/SKK-JISYO.L ] && [ -f client/public/vendor/kuromoji/kuromoji.js ]; then
            echo "Dictionaries already present."
          else
            npm run setup
          fi

      - name: Build
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
